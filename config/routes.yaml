contao_live_edit_editor:
    path: /contao-live-edit
    controller: ContaoLiveEdit\Controller\EditorController
    methods: [GET]

contao_live_edit_editor_shortcut:
    path: /editor
    controller: ContaoLiveEdit\Controller\EditorController
    methods: [GET]

contao_live_edit_save:
    path: /contao-live-edit/save-inline
    controller: ContaoLiveEdit\Controller\InlineContentSaveController
    methods: [POST]

contao_live_edit_save_link:
    path: /contao-live-edit/save-link
    controller: ContaoLiveEdit\Controller\InlineContentSaveController::saveLink
    methods: [POST]

contao_live_edit_save_image:
    path: /contao-live-edit/save-image
    controller: ContaoLiveEdit\Controller\InlineContentSaveController::saveImage
    methods: [POST]

contao_live_edit_image_library:
    path: /contao-live-edit/image-library
    controller: ContaoLiveEdit\Controller\InlineContentSaveController::browseImages
    methods: [GET]

contao_live_edit_reorder:
    path: /contao-live-edit/reorder-content
    controller: ContaoLiveEdit\Controller\InlineContentSaveController::reorderContent
    methods: [POST]

contao_live_edit_insert:
    path: /contao-live-edit/insert-content
    controller: ContaoLiveEdit\Controller\InlineContentSaveController::insertContent
    methods: [POST]

contao_live_edit_content_elements:
    path: /contao-live-edit/content-elements
    controller: ContaoLiveEdit\Controller\InlineContentSaveController::listContentElements
    methods: [GET]

contao_live_edit_element_fields:
    path: /contao-live-edit/element-fields/{id}
    controller: ContaoLiveEdit\Controller\InlineContentSaveController::elementFields
    methods: [GET]

contao_live_edit_save_element_fields:
    path: /contao-live-edit/save-element-fields
    controller: ContaoLiveEdit\Controller\InlineContentSaveController::saveElementFields
    methods: [POST]

contao_live_edit_delete_element:
    path: /contao-live-edit/delete-element
    controller: ContaoLiveEdit\Controller\InlineContentSaveController::deleteElement
    methods: [POST]

contao_live_edit_templates:
    path: /contao-live-edit/templates
    controller: ContaoLiveEdit\Controller\TemplateEditController::list
    methods: [GET]

contao_live_edit_template_read:
    path: /contao-live-edit/template-source
    controller: ContaoLiveEdit\Controller\TemplateEditController::read
    methods: [GET]

contao_live_edit_template_save:
    path: /contao-live-edit/save-template
    controller: ContaoLiveEdit\Controller\TemplateEditController::save
    methods: [POST]
